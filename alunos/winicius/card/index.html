<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card - Winicius</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <article class="card">
        <header class="card-top">
          <div class="tag-wrap">
            <span class="tag tag-trabalho">TRABALHO</span>
            <span class="tag tag-urgente">URGENTE</span>
          </div>
          <button class="btn-trash" aria-label="Excluir">
            🗑️
          </button>
        </header>

        <h1>Anotações da reunião</h1>

        <p>
          Discuss project milestones for the upcoming Q4 product launch and sync
          with the engineering team on resource allocation.
        </p>

        <footer class="card-bottom">
          <div class="switches">
            <span class="switch on"></span>
            <span class="switch off"></span>
          </div>
          <span class="created">Criado 2h atrás</span>
        </footer>
      </article>
    </main>
  </body>
</html>
